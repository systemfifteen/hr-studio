<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Studio Monitor</title>
<style>
  :root { --cell: 200px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #header { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; background: #0a0a0a; border-bottom: 1px solid #222; flex-shrink: 0; }
  #header .logo { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
  #header .logo span { color: #e03060; }
  #header-right { display: flex; align-items: center; gap: 16px; }
  #clock { font-size: calc(var(--cell) * .09); color: #ccc; font-weight: 700; }
  #conn-status { font-size: 20px; }

  #grid { flex: 1; display: grid; gap: 8px; padding: 10px; overflow: hidden; }

  .card { border-radius: 10px; overflow: hidden; }
  .card-inner { padding: calc(var(--cell) * .04) calc(var(--cell) * .05); width: 100%; height: 100%; border-radius: 10px; transition: background 0.4s; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
  .card-header { display: flex; justify-content: space-between; align-items: center; }
  .card-name { font-size: calc(var(--cell) * .09); font-weight: 700; color: #fff; letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%; }
  .card-bat-wrap { font-size: calc(var(--cell) * .07); color: rgba(255,255,255,.7); }
  .zone-history { display: flex; gap: 1px; height: calc(var(--cell) * 0.045); min-height: 5px; border-radius: 3px; overflow: hidden; flex-shrink: 0; background: rgba(0,0,0,0.4); padding: 2px; box-sizing: border-box; }
  .zh-seg { flex: 1; border-radius: 1px; }
  .zone-bar { height: calc(var(--cell) * .018); min-height: 3px; background: rgba(255,255,255,.15); border-radius: 2px; flex-shrink: 0; }
  .zone-fill { height: 100%; border-radius: 2px; background: rgba(255,255,255,.6); transition: width .6s ease; }
  .card-pct { font-size: calc(var(--cell) * .30); font-weight: 700; color: #fff; line-height: 1; }
  .card-watts { font-size: calc(var(--cell) * .10); font-weight: 600; color: rgba(255,255,255,.9); text-align: right; background: rgba(0,0,0,.25); border-radius: 10px; padding: 1px 6px; align-self: flex-end; }
  .watts-label { font-size: .75em; font-weight: 400; color: rgba(255,255,255,.5); letter-spacing: 1px; }
  .card-meps { font-size: calc(var(--cell) * .08); font-weight: 600; color: rgba(255,255,255,.9); background: rgba(0,0,0,.25); border-radius: 10px; padding: 1px 6px; }
  .meps-label { font-size: .85em; font-weight: 400; color: rgba(255,255,255,.6); letter-spacing: 1px; }
  .card-footer { display: flex; justify-content: space-between; align-items: center; }
  .card-bpm { font-size: calc(var(--cell) * .08); color: rgba(255,255,255,.8); background: rgba(0,0,0,.25); border-radius: 10px; padding: 1px 6px; }
  .card-cal { font-size: calc(var(--cell) * .07); color: rgba(255,255,255,.85); white-space: nowrap; background: rgba(0,0,0,.25); border-radius: 10px; padding: 1px 6px; }
  .card-pos { font-size: calc(var(--cell) * .055); color: rgba(255,255,255,.4); background: rgba(0,0,0,.2); border-radius: 8px; padding: 1px 5px; }
  .card-offline { font-size: calc(var(--cell) * .065); color: rgba(255,255,255,.4); letter-spacing: 1px; text-align: center; padding: 4px 0; }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 20px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; }

  #timer-cell { border-radius: 10px; background: #0f0f0f; overflow: hidden; grid-column: span 2; grid-row: span 2; }

  #summary-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 50; }
  #summary-overlay.open { display: flex; }
  #summary-box { background: #1a1a1a; border: 1px solid #333; border-radius: 14px; padding: 32px; max-width: 90vw; width: 700px; max-height: 85vh; overflow-y: auto; }
  #summary-box h2 { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #fff; }
  .sum-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .sum-card { background: #242424; border-radius: 10px; padding: 14px 16px; }
  .sum-name { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .sum-row { display: flex; justify-content: space-between; font-size: 13px; color: #aaa; margin-top: 3px; }
  .sum-row span:last-child { color: #fff; font-weight: 600; }
  .sum-zones { display: flex; gap: 3px; margin-top: 8px; border-radius: 4px; overflow: hidden; height: 6px; }
  .sum-zone-bar { height: 100%; }
  #summary-close { display: block; margin: 24px auto 0; padding: 10px 32px; background: #e03060; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div id="header">
  <div class="logo">HEART<span>ZONE</span></div>
  <div id="header-right">
    <span id="clock">--:--:--</span>
    <span id="netinfo" style="font-size:13px;color:#888"></span>
    <span id="battery" style="font-size:13px;color:#888"></span>
    <a href="/admin.html" style="font-size:13px;color:#666;text-decoration:none;padding:4px 10px;border:1px solid #333;border-radius:6px;" title="Admin panel">⚙</a>
    <span id="conn-status" title="WebSocket stav">○</span>
  </div>
</div>

<div id="grid">
  <div style="color:#555;padding:20px;font-size:14px">Čakám na dáta...</div>
</div>

<div id="summary-overlay">
  <div id="summary-box">
    <h2>🏁 Koniec hodiny</h2>
    <div class="sum-grid" id="sum-grid"></div>
    <button id="summary-close" onclick="document.getElementById('summary-overlay').classList.remove('open')">Zavrieť</button>
  </div>
</div>

<div id="toast"></div>

<script src="dashboard.js"></script>
</body>
</html>
