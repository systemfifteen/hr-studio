services:
  gateway:
    build: ./gateway
    restart: unless-stopped
    network_mode: host
    volumes:
      - /run/dbus:/run/dbus
      - hr_data:/data
    privileged: true
    environment:
      - LOCAL_CACHE_DB=/data/local_cache.db
      - WS_PORT=8765
      - GATEWAY_RELOAD_PORT=8766

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    extra_hosts:
      - gateway:host-gateway
    depends_on:
      - gateway

volumes:
  hr_data:
