# =============================================================================
# HR Studio — Debian 13 (Trixie) preseed
# Plne automatická inštalácia, žiadne otázky
# =============================================================================

# ── Lokalizácia ───────────────────────────────────────────────────────────────
d-i debian-installer/locale         string sk_SK.UTF-8
d-i keyboard-configuration/xkb-keymap select sk
d-i keyboard-configuration/layout   string Slovak
d-i keyboard-configuration/variant  string qwerty

# ── Sieť — auto (ethernet ak zapojený, inak WiFi) ────────────────────────────
d-i netcfg/choose_interface         select auto
d-i netcfg/disable_wireless         boolean true
d-i netcfg/get_hostname             string hrstudio
d-i netcfg/get_domain               string local
d-i hw-detect/load_firmware         boolean true

# ── Zrkadlo (mirror) ──────────────────────────────────────────────────────────
d-i mirror/country              string SK
d-i mirror/http/hostname        string deb.debian.org
d-i mirror/http/directory       string /debian
d-i mirror/http/proxy           string
d-i mirror/suite                string trixie

# ── Hodiny / NTP ──────────────────────────────────────────────────────────────
d-i clock-setup/utc             boolean true
d-i time/zone                   string Europe/Bratislava
d-i clock-setup/ntp             boolean true

# ── Disk — celý prvý disk, bez LVM, bez šifrovania ───────────────────────────
d-i partman-auto/disk           string /dev/nvme0n1 /dev/sda
d-i partman-auto/method         string regular
d-i partman-auto/choose_recipe  select atomic
d-i partman/default_filesystem  string ext4
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition    select finish
d-i partman/confirm             boolean true
d-i partman/confirm_nooverwrite boolean true

# ── Root heslo — zakázané (použijeme sudo usera) ──────────────────────────────
d-i passwd/root-login           boolean false

# ── Admin user ────────────────────────────────────────────────────────────────
d-i passwd/user-fullname        string HR Studio Admin
d-i passwd/username             string admin
# Heslo: "hrstudio" — ZMEŇ PRED PRODUKČNÝM POUŽITÍM
d-i passwd/user-password        password hrstudio
d-i passwd/user-password-again  password hrstudio
d-i passwd/user-default-groups  string sudo audio video

# ── Základné balíky ───────────────────────────────────────────────────────────
tasksel tasksel/first           multiselect standard
d-i pkgsel/include              string \
    sudo curl git ca-certificates gnupg lsb-release \
    bluez bluetooth sqlite3 \
    openssh-server

d-i pkgsel/upgrade              select full-upgrade
d-i pkgsel/update-policy        select unattended-upgrades

# ── GRUB bootloader ───────────────────────────────────────────────────────────
d-i grub-installer/only_debian  boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev      string default

# ── Post-install: spusti setup skripty ───────────────────────────────────────
d-i preseed/late_command string \
    in-target bash -c ' \
        set -e; \
        echo "=== HR Studio post-install ===" ; \
        \
        # Stiahni repozitár \
        git clone https://github.com/systemfifteen/hr-studio.git /opt/hr-studio ; \
        \
        # Spusti setup.sh (Docker, BT, systemd service) \
        bash /opt/hr-studio/setup.sh ; \
        \
        # Spusti kiosk setup (X11, Chromium, autologin) \
        bash /opt/hr-studio/setup-kiosk.sh --non-interactive ; \
    '

# ── Reboot po dokončení ───────────────────────────────────────────────────────
d-i finish-install/reboot_in_progress note
